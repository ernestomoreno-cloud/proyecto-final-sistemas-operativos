services:
  backend-1:
    build: ./backend
    container_name: backend-1
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-1
      - INSTANCE_COLOR=#2563eb
    networks:
      - red_infraestructura
    restart: unless-stopped

  backend-2:
    build: ./backend
    container_name: backend-2
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-2
      - INSTANCE_COLOR=#059669
    networks:
      - red_infraestructura
    restart: unless-stopped

  backend-3:
    build: ./backend
    container_name: backend-3
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-3
      - INSTANCE_COLOR=#d97706
    networks:
      - red_infraestructura
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - red_infraestructura
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - red_infraestructura
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    pid: host
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - red_infraestructura
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - nginx-exporter
      - cadvisor
      - backend-1
      - backend-2
      - backend-3
    networks:
      - red_infraestructura
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - red_infraestructura
    restart: unless-stopped

networks:
  red_infraestructura:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
